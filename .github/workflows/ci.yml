name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Only chromium: the suite tests application behaviour, not browser
      # differences, and three engines would triple the run for no new signal.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The migration chain has repeatedly produced bugs that a clean run
      # catches and an incremental one does not, so build from empty every time.
      - name: Verify the migration chain applies from empty
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
          ADMIN_PIN: '1234'
          STUDENT_PIN: '4321'
          DATABASE_URL: sqlite+aiosqlite:///./ci-check.db
        run: |
          .venv/bin/python -m alembic upgrade head
          .venv/bin/python -m alembic downgrade base
          rm -f ci-check.db

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
